# dockur/windows 部署模板 - TinyWin2 kiosk VM (podman-compose 1.6.0)
#
# 用法 (WSL Ubuntu):
#   mkdir -p ~/dockur-tw2 && cd ~/dockur-tw2
#   cp <repo>/deploy/dockur-compose.yaml compose.yaml
#   cp win11_home_26300.9457_vminit.iso custom.iso    # tinywin2 build 产物
#   podman-compose up -d
#   # Web 查看器: http://127.0.0.1:8006/ (WSL localhost 转发到 Windows)
#
# /storage 数据布局 (~/dockur-tw2):
#   custom.iso  安装介质; dockur 检测到后优先引导, 装完保留可随时重装
#   data.img    guest 系统盘 (稀疏文件, 上限 32G)
#
# guest: TinyWin / 123456 (Administrators, 自动登录)
# 传入文件: 宿主 Downloads 经 dockur 内置 smbd 共享为 \\server\Data;
#   镜像已内置 AllowInsecureGuestAuth=1, 无需认证即可连接。

services:
  windows:
    image: docker.io/dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"      # 有 custom.iso 时 dockur 直接引导我们的镜像
      DISK_SIZE: "32G"   # data.img 上限 (稀疏, 按需增长)
      RAM_SIZE: "2G"
      CPU_CORES: "2"
    devices:
      - /dev/kvm         # KVM 硬件加速 (WSL2 内核)
    # 不要挂 /dev/net/tun、不要 NET_ADMIN: tun 可用时 dockur 切 TAP 桥接,
    # guest 会拿走容器 IP(172.x) 而 smbd 仍绑 20.20.20.1 -> SMB 不可达。
    # 无 tun 时 dockur 用 passt 用户态网络(20.20.20.x), smbd 原生可用。
    ports:
      - 127.0.0.1:8006:8006
    volumes:
      - /home/triti/dockur-tw2:/storage    # dockur 数据家: data.img/custom.iso/setup.img/UEFI vars
      - /mnt/c/Users/triti/Downloads:/shared
      # ^ 宿主侧路径可换任意目录; 容器侧必须挂为 /shared -
      #   dockur samba.sh 只认 /shared, 自动发布为 [Data] 共享(guest ok),
      #   guest 经 \\网关IP\Data 访问(网关 IP 用 guest 里 ipconfig 查)。
      #   共享名固定 Data, YAML 顺序无关。
    restart: always      # WSL 启动即自动拉起 VM
    stop_grace_period: 2m
